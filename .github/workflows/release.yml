name: Release Skill ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "push" ] && [ "$RELEASE_TAG" != "v${PKG_VER}" ]; then
            echo "Tag does not match package.json version v${PKG_VER}"
            exit 1
          fi
      - name: Run tests and strict documentation checks
        run: |
          npm test
          node scripts/cli.mjs doctor
          node scripts/cli.mjs verify docs/document.json docs/documentacao.validation.json --strict
          node scripts/cli.mjs verify docs/document-summary.json docs/documentacao-resumida.validation.json --strict
      - name: Build slim skill archive
        run: npm run package:skill
      - uses: actions/upload-artifact@v4
        with:
          name: project-html-docs-skill
          path: dist/project-html-docs-v*.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/project-html-docs-v*.zip
          generate_release_notes: true
