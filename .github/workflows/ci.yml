name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Verify example builds
        run: |
          npm run build:example
          npm run build:showcase
      - name: Verify strict receipts
        run: |
          node scripts/verify.mjs docs/document.json docs/documentacao.validation.json --strict
          node scripts/verify.mjs docs/document-summary.json docs/documentacao-resumida.validation.json --strict
